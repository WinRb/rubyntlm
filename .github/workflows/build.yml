---
name: build

"on":
  pull_request:
  push:
    branches:
      - main

# The job only ever reads the checkout; deny everything else by default.
permissions:
  contents: read

# A new push to a PR makes the in-flight run redundant. Never cancel main,
# because those runs are what the README badge reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
      - name: Audit Ruby runtime
        # CVE-2026-41316 is an ERB flaw fixed in Ruby 4.0.3 and not yet backported.
        # Ignored on affected rubies only. See:
        # https://www.ruby-lang.org/en/news/2026/04/21/erb-cve-2026-41316/
        # https://github.com/advisories/GHSA-q339-8rmv-2mhv
        run: |
          ignore=""
          if ruby -e 'exit 1 unless Gem::Version.new(RUBY_VERSION) < Gem::Version.new("4.0.3")'; then
            ignore="--ignore CVE-2026-41316"
          fi
          bundle exec ruby-audit check $ignore

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false # fail the build on findings instead of uploading SARIF

  lint:
    # Advisory-only on this first pass: RuboCop findings are reported for a
    # later dedicated cleanup, not fixed here.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop --format github

  unit:
    name: ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Nightly builds break for reasons that are not this gem's fault, so they
    # report without failing the run.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        include:
          - os: ubuntu-latest
            ruby: 'head'
            experimental: true
          - os: windows-latest
            ruby: 'head'
            experimental: true
          # truffleruby has no Windows build via setup-ruby.
          - os: ubuntu-latest
            ruby: 'truffleruby'
          - os: ubuntu-latest
            ruby: 'truffleruby-head'
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        if: matrix.os != 'ubuntu-latest' || matrix.ruby != '3.4'
        run: bundle exec rake spec

      - name: Run specs with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.4'
        run: bundle exec rake coverage

      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.4'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/.resultset.json
          format: simplecov

